[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-criu"
version = "0.1.0"
description = "Experimental vLLM sleep, CRIU checkpoint, and restore controller"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vllm-criu = "vllm_criu.launcher:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_criu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "criu_integration: stateful suspend/restore test; requires a running CRIU-enabled vLLM service",
]
